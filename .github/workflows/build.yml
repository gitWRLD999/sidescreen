name: Windows build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build pinned original native adapters
        shell: powershell
        run: .\native\prepare-native.ps1
      - name: Compile and test
        shell: powershell
        run: .\build.ps1 -Test
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          @(Get-ChildItem scripts,tests,native -Filter *.ps1) + @(Get-Item build.ps1) | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Verify Muse adapter
        run: node tests/muse-adapter.mjs
      - name: Build independent desktop plugin
        working-directory: mcp
        run: |
          npm ci
          npm test
          npm run build
          node validate-plugin.mjs
      - name: Package desktop plugin
        shell: powershell
        run: .\scripts\package-plugin.ps1 -OutputDirectory .\work\release
      - uses: actions/upload-artifact@v7
        with:
          name: sidescreen-desktop-plugin
          path: |
            work/release/*.zip
            work/release/SHA256SUMS.txt
